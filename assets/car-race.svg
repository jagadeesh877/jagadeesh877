<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#3b2f8f"/>
    </linearGradient>
    <g id="wheel">
      <circle r="11" fill="#0b0b0b"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.25s" repeatCount="indefinite"/>
        <circle r="6" fill="#9ca3af"/>
        <path d="M-6 0H6M0 -6V6" stroke="#374151" stroke-width="2"/>
      </g>
    </g>
    <g id="car">
      <g transform="translate(0 38)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;1.7 1.2;1 1" dur="0.15s" repeatCount="indefinite"/>
          <path d="M0 -6 L-26 0 L0 6 Z" fill="#fbbf24"/>
        </g>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="0.2s" repeatCount="indefinite"/>
        <path d="M124 28 L165 18 L165 42 Z" fill="#fde047" opacity="0.35">
          <animate attributeName="opacity" values="0.15;0.45;0.15" dur="0.4s" repeatCount="indefinite"/>
        </path>
        <rect x="0" y="20" width="124" height="24" rx="9" fill="currentColor"/>
        <path d="M28 20 L44 3 H84 L100 20 Z" fill="currentColor"/>
        <path d="M34 20 L47 7 H62 V20 Z M67 20 V7 H82 L94 20 Z" fill="#bae6fd"/>
        <rect x="4" y="30" width="116" height="4" fill="#ffffff" opacity="0.85"/>
        <rect x="116" y="26" width="8" height="5" rx="2" fill="#fef08a"/>
        <use href="#wheel" x="30" y="44"/>
        <use href="#wheel" x="96" y="44"/>
      </g>
    </g>
  </defs>

  <rect width="800" height="230" fill="url(#sky)"/>

  <g fill="#ffffff">
    <circle cx="60" cy="20" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="48" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="16" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="52" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="22" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="46" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>

  <path d="M0 80 V60 H40 V48 H80 V64 H120 V42 H170 V58 H215 V50 H260 V66 H310 V44 H350 V60 H400 V52 H450 V68 H500 V46 H545 V62 H600 V50 H650 V66 H700 V44 H750 V60 H800 V80 Z" fill="#1e1b4b"/>

  <text x="400" y="38" text-anchor="middle" font-family="Courier New, monospace" font-size="26" font-weight="bold" fill="#f472b6">
    FULL THROTTLE
    <animate attributeName="fill" values="#f472b6;#8b5cf6;#38bdf8;#facc15;#f472b6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="1.2s" repeatCount="indefinite"/>
  </text>

  <rect x="0" y="80" width="800" height="130" fill="#1f2937"/>

  <line x1="0" y1="77" x2="800" y2="77" stroke="#ffffff" stroke-width="6"/>
  <line x1="0" y1="77" x2="800" y2="77" stroke="#ef4444" stroke-width="6" stroke-dasharray="24 24">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="213" x2="800" y2="213" stroke="#ffffff" stroke-width="6"/>
  <line x1="0" y1="213" x2="800" y2="213" stroke="#ef4444" stroke-width="6" stroke-dasharray="24 24">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="0.5s" repeatCount="indefinite"/>
  </line>

  <line x1="0" y1="145" x2="800" y2="145" stroke="#e5e7eb" stroke-width="4" stroke-dasharray="40 28">
    <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="0.35s" repeatCount="indefinite"/>
  </line>

  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <line x1="0" y1="0" x2="70" y2="0"><animateTransform attributeName="transform" type="translate" from="800 98" to="-100 98" dur="0.7s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="50" y2="0"><animateTransform attributeName="transform" type="translate" from="800 132" to="-100 132" dur="0.5s" begin="-0.2s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="80" y2="0"><animateTransform attributeName="transform" type="translate" from="800 168" to="-100 168" dur="0.6s" begin="-0.3s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="60" y2="0"><animateTransform attributeName="transform" type="translate" from="800 198" to="-100 198" dur="0.45s" begin="-0.1s" repeatCount="indefinite"/></line>
  </g>

  <g color="#ef4444">
    <animateTransform attributeName="transform" type="translate" from="-190 88" to="830 88" dur="3.4s" repeatCount="indefinite"/>
    <use href="#car"/>
  </g>
  <g color="#3b82f6">
    <animateTransform attributeName="transform" type="translate" from="-190 88" to="830 88" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
    <use href="#car"/>
  </g>
  <g color="#facc15">
    <animateTransform attributeName="transform" type="translate" from="-190 152" to="830 152" dur="4.6s" repeatCount="indefinite"/>
    <use href="#car"/>
  </g>
  <g color="#22c55e">
    <animateTransform attributeName="transform" type="translate" from="-190 152" to="830 152" dur="4.6s" begin="-2.3s" repeatCount="indefinite"/>
    <use href="#car"/>
  </g>
</svg>
