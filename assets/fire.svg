<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="fp" d="M0,0 C-55,0 -75,-45 -62,-85 C-55,-105 -35,-115 -38,-145 C-20,-130 -12,-110 -14,-95 C-5,-120 8,-150 -2,-195 C35,-165 70,-120 62,-70 C58,-30 40,0 0,0 Z"/>
    <linearGradient id="gOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <g id="flame">
      <ellipse cx="0" cy="-70" rx="110" ry="110" fill="url(#glow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="0.9s" repeatCount="indefinite"/>
      </ellipse>
      <use href="#fp" fill="url(#gOuter)"/>
      <g transform="scale(0.75)">
        <animateTransform attributeName="transform" type="scale" values="0.72;0.82;0.72" dur="0.7s" repeatCount="indefinite"/>
        <use href="#fp" fill="#fb923c"/>
      </g>
      <g transform="scale(0.48)">
        <animateTransform attributeName="transform" type="scale" values="0.42;0.56;0.42" dur="0.5s" repeatCount="indefinite"/>
        <use href="#fp" fill="#fde047"/>
      </g>
    </g>
  </defs>

  <!-- left flame: slow zoom -->
  <g transform="translate(130 240)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0.55;0.8;0.55" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <use href="#flame"/>
    </g>
  </g>

  <!-- right flame: slow zoom, other phase -->
  <g transform="translate(470 240)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0.8;0.55;0.8" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <use href="#flame"/>
    </g>
  </g>

  <!-- centre flame: big zoom in and out -->
  <g transform="translate(300 245)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0.8;1.25;0.8" dur="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <use href="#flame"/>
    </g>
  </g>

  <!-- rising embers -->
  <g fill="#fbbf24">
    <circle cx="250" cy="200" r="3"><animate attributeName="cy" from="200" to="10" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" from="1" to="0" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="190" r="2.5"><animate attributeName="cy" from="190" to="0" dur="2.6s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="opacity" from="1" to="0" dur="2.6s" begin="-0.8s" repeatCount="indefinite"/></circle>
    <circle cx="345" cy="205" r="3"><animate attributeName="cy" from="205" to="15" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/><animate attributeName="opacity" from="1" to="0" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="190" r="2"><animate attributeName="cy" from="190" to="40" dur="2.4s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="opacity" from="1" to="0" dur="2.4s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="200" r="2.5"><animate attributeName="cy" from="200" to="50" dur="1.9s" begin="-1.3s" repeatCount="indefinite"/><animate attributeName="opacity" from="1" to="0" dur="1.9s" begin="-1.3s" repeatCount="indefinite"/></circle>
    <circle cx="455" cy="195" r="2"><animate attributeName="cy" from="195" to="45" dur="2.3s" begin="-0.2s" repeatCount="indefinite"/><animate attributeName="opacity" from="1" to="0" dur="2.3s" begin="-0.2s" repeatCount="indefinite"/></circle>
    <circle cx="490" cy="205" r="2.5"><animate attributeName="cy" from="205" to="55" dur="2s" begin="-1.5s" repeatCount="indefinite"/><animate attributeName="opacity" from="1" to="0" dur="2s" begin="-1.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
